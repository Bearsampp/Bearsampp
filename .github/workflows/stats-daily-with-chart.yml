name: stats-daily-with-chart

on:
  schedule:
    # midnight central usa
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: stats-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # justagwas/github-downloads-action@v1 still declares node20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: write

jobs:
  publish-downloads:
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      total: ${{ steps.publish.outputs.total }}
      day: ${{ steps.publish.outputs.day }}
      week: ${{ steps.publish.outputs.week }}
      month: ${{ steps.publish.outputs.month }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # main is protected (requires an approving review), so the snapshot is
      # written to an unprotected staging branch and promoted by a PR below.
      - name: Publish downloads.json and trend chart to staging branch
        id: publish
        uses: justagwas/github-downloads-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          window_days: "180"
          enable_hourly_profile: "false"
          output_branch: "gh-dl-data"
          output_path: "stats/downloads.json"
          min_refresh_minutes: "0"
          publish_chart: "true"
          chart_output_path: "stats/downloads-trend.svg"
          chart_types: "total-trend,daily,weekly,monthly"
          chart_themes: "black"
          charts_output_dir: "stats/charts"
          chart_width: "1000"
          chart_height: "360"
          chart_zero_baseline: "true"
          chart_y_ticks: "6"
          chart_x_label_every_days: "0"
          chart_show_value_labels: "false"
          chart_date_label_format: "yyyy-mm-dd"
          chart_show_generated_at: "true"
          chart_title_mode: "default"

      - name: Check for changes
        id: check
        run: |
          if [ "${{ steps.publish.outputs.published }}" = "true" ] || [ "${{ steps.publish.outputs.chart_published }}" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Snapshot changed (json published: ${{ steps.publish.outputs.published }}, chart published: ${{ steps.publish.outputs.chart_published }})."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No material change; skipping PR."
          fi

      - name: Collect generated files from staging branch
        if: steps.check.outputs.changed == 'true'
        run: |
          git fetch --depth=1 origin gh-dl-data
          git checkout FETCH_HEAD -- stats
          ls -R stats

      - name: Upload downloads files
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: stats-files
          path: stats
          if-no-files-found: error

  create-update-pr:
    runs-on: ubuntu-26.04
    needs: publish-downloads
    if: needs.publish-downloads.outputs.changed == 'true'
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download downloads files
        uses: actions/download-artifact@v8
        with:
          name: stats-files
          path: stats-artifact

      - name: Apply downloads files
        run: |
          # The tracking folder is now named stats (was gh-dl). Preserve the
          # repo-customized dashboard pages through every snapshot write because
          # github-downloads-action only produces the JSON and charts.
          mkdir -p _dash
          for f in dashboard.html dashboard.md; do
            if [ -f "gh-dl/$f" ]; then
              cp "gh-dl/$f" "_dash/$f"
            elif [ -f "stats/$f" ]; then
              cp "stats/$f" "_dash/$f"
            fi
          done
          rm -rf stats
          mv stats-artifact stats
          if [ -f "_dash/dashboard.md" ]; then
            sed -i 's@gh-dl@stats@g' "_dash/dashboard.md"
            mv "_dash/dashboard.md" "stats/dashboard.md"
          fi
          if [ -f "_dash/dashboard.html" ]; then
            mv "_dash/dashboard.html" "stats/dashboard.html"
          fi
          rm -rf _dash gh-dl
          # Drop the previously synced gh-dl workflow so it stops racing this one.
          rm -f .github/workflows/gh-dl-daily-with-chart.yml
          git status

      - name: Render dashboard.md from downloads.json
        env:
          STATS_BRANCH: ${{ github.ref_name }}
        run: |
          # Keep dashboard.md in sync with downloads.json. If a repository has no
          # dashboard.md yet (the action only emits the JSON and charts), seed a
          # generic one from the snapshot so the module can render immediately.
          python3 - <<'PY'
          import json
          import os
          import pathlib
          from urllib.parse import quote

          root = pathlib.Path("stats")
          dash = root / "dashboard.md"
          data_path = root / "downloads.json"
          if not data_path.exists():
              print("No stats/downloads.json found; skipping dashboard render.")
              raise SystemExit(0)

          data = json.loads(data_path.read_text(encoding="utf-8"))
          owner = data.get("owner", "")
          repo = data.get("repo", "")
          profile = data.get("profile") or {}
          snap = data.get("snapshots") or {}
          partial = data.get("partial") or {}

          flags = [k for k in ("day", "week", "month") if partial.get(k)]
          if not flags:
              dwm = "complete"
          elif len(flags) == 3:
              dwm = "partial \u2014 not enough history yet"
          else:
              dwm = "partial \u2014 " + ", ".join(flags) + " not enough history yet"

          table = [
              "| Field | Value |",
              "|---|---|",
              f"| Repository | `{owner}/{repo}` |",
              f"| Update mode | {profile.get('defaultMode', '')} |",
              f"| Window | {snap.get('windowDays', '')} days |",
              f"| Snapshots collected | {snap.get('count', '')} |",
              f"| Day / week / month | {dwm} |",
          ]

          branch = os.environ.get("STATS_BRANCH") or "main"

          def badge(alt, label, query, color):
              raw_json = f"https://raw.githubusercontent.com/{owner}/{repo}/{branch}/stats/downloads.json"
              releases = f"https://github.com/{owner}/{repo}/releases"
              return (
                  f"[![{alt}](https://img.shields.io/badge/dynamic/json"
                  f"?url={quote(raw_json, safe='')}"
                  f"&query={quote(query, safe='')}"
                  f"&label={quote(label, safe='')}"
                  f"&color={color}&style=flat-square&logo=github&cacheSeconds=0)]"
                  f"({releases})"
              )

          if not dash.exists():
              default_doc = "\n".join([
                  f"# {repo} Downloads",
                  "",
                  f"Release asset download totals for [{repo}](https://github.com/{owner}/{repo}), "
                  "tracked daily by [GitHub Downloads Action](https://github.com/justagwas/github-downloads-action).",
                  "",
                  badge("Total downloads", "downloads/total", "$.stats.total", "0A7EA4"),
                  badge("Downloads today", "downloads/day", "$.stats.day", "1E8E3E"),
                  badge("Downloads this week", "downloads/week", "$.stats.week", "0069C2"),
                  badge("Downloads this month", "downloads/month", "$.stats.month", "B26A00"),
                  "",
                  "## Total downloads trend",
                  "",
                  "![Total downloads trend](charts/total-trend--black.svg)",
                  "",
                  "## All charts",
                  "",
                  "Each chart is regenerated by the workflow, so these never go stale.",
                  "",
                  "### total-trend",
                  "",
                  "![Total downloads trend](charts/total-trend--black.svg)",
                  "",
                  "### daily",
                  "",
                  "![Daily downloads](charts/daily--black.svg)",
                  "",
                  "### weekly",
                  "",
                  "![Weekly downloads](charts/weekly--black.svg)",
                  "",
                  "### monthly",
                  "",
                  "![Monthly downloads](charts/monthly--black.svg)",
                  "",
                  "## Data",
                  "",
                  "Raw snapshot data lives in [`downloads.json`](downloads.json).",
                  "",
                  *table,
                  "",
                  "`day`, `week`, and `month` stay flagged partial until the action has collected "
                  "enough daily history to compare against. Expect roughly a week before weekly "
                  "comparisons become meaningful and a month before monthly ones do.",
                  "",
                  "## Notes",
                  "",
                  "Repository copies, page views, and automatically generated source archives are not "
                  "counted. Only files attached to GitHub Releases are included.",
                  "",
                  "Badges are served by [shields.io](https://shields.io) and cache for 15 minutes, so "
                  "they can lag the snapshot by up to that much. The charts below are regenerated by "
                  "the workflow and are never cached.",
                  "",
              ])
              dash.write_text(default_doc, encoding="utf-8", newline="\n")
              print(f"Created a default stats/dashboard.md for {owner}/{repo}")
              raise SystemExit(0)

          text = dash.read_text(encoding="utf-8")
          trailing_newline = text.endswith(("\n", "\r"))
          lines = text.splitlines()
          out = []
          i = 0
          replaced = False
          while i < len(lines):
              if not replaced and lines[i].strip() == "| Field | Value |":
                  j = i + 2
                  while j < len(lines) and lines[j].lstrip().startswith("|"):
                      j += 1
                  out.extend(table)
                  i = j
                  replaced = True
                  continue
              out.append(lines[i])
              i += 1

          if not replaced:
              try:
                  idx = out.index("## Data")
              except ValueError:
                  print("No data table and no '## Data' heading; skipping.")
                  raise SystemExit(0)
              insert_at = idx + 1
              if insert_at < len(out) and out[insert_at].strip() == "":
                  insert_at += 1
              out[insert_at:insert_at] = table + [""]

          result = "\n".join(out).rstrip("\n")
          if trailing_newline:
              result += "\n"
          dash.write_text(result, encoding="utf-8", newline="\n")
          print("Updated stats/dashboard.md data table from stats/downloads.json")
          PY

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GH_PAT }}
          author: Bearsampp <support@bearsampp.com>
          branch: update-stats
          base: main
          title: 'Update downloads tracking snapshot'
          body: |
            Automated update of the release download snapshot and charts.

            Total: ${{ needs.publish-downloads.outputs.total }}
            Day: ${{ needs.publish-downloads.outputs.day }}
            Week: ${{ needs.publish-downloads.outputs.week }}
            Month: ${{ needs.publish-downloads.outputs.month }}
          commit-message: 'Update stats downloads snapshot'
          delete-branch: true

      - name: Approve Pull Request
        if: steps.cpr.outputs.pull-request-operation != 'none' && steps.cpr.outputs.pull-request-operation != ''
        env:
          GH_TOKEN: ${{ secrets.BEARSAMPP_BOT_PAT }}
        run: |
          set +e
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"
          echo "Operation - ${{ steps.cpr.outputs.pull-request-operation }}"

          gh pr review --approve "${{ steps.cpr.outputs.pull-request-number }}" \
            || echo "::notice ::Could not approve PR (self-approval or missing permissions); continuing..."

      - name: Enable Pull Request Automerge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e
          PR_NUMBER="${{ steps.cpr.outputs.pull-request-number }}"

          # A PR that is already closed/merged has nothing to do.
          PR_STATE=$(gh pr view "$PR_NUMBER" --json state --jq .state)
          if [ "$PR_STATE" != "OPEN" ]; then
            echo "PR #$PR_NUMBER is $PR_STATE; nothing to merge."
            exit 0
          fi

          gh repo view --json autoMergeAllowed || echo "Failed to get repo settings"

          echo "Attempting auto-merge..."
          if gh pr merge --merge --auto --admin "$PR_NUMBER"; then
            echo "✓ Auto-merge enabled"
            exit 0
          fi

          # Give required checks a chance to settle, then merge directly.
          echo "Waiting 30 seconds before direct merge attempt..."
          sleep 30

          gh pr view "$PR_NUMBER" --json state,mergeable,mergeStateStatus,statusCheckRollup \
            || echo "Failed to get PR status"

          if gh pr merge --merge --admin "$PR_NUMBER"; then
            echo "✓ Direct merge successful"
            exit 0
          fi

          echo "::warning ::Could not merge PR #$PR_NUMBER. It likely needs review or has failing checks."
          gh pr view "$PR_NUMBER" || echo "Failed to read PR"
          gh pr check "$PR_NUMBER" || echo "No checks found."
          exit 0
