name: gh-dl-daily-with-chart-and-automerge

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, opened]
  check_suite:
    types: [completed]
  status: {}

concurrency:
  group: gh-dl-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish-downloads:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Publish downloads.json and trend chart to gh-pages
        uses: justagwas/github-downloads-action@v1
        with:
          token: ${{ secrets.BEARSAMPP_BOT_PAT }}
          window_days: "45"
          enable_hourly_profile: "false"
          output_branch: "gh-pages"
          output_path: "gh-dl/downloads.json"
          min_refresh_minutes: "0"
          publish_chart: "true"
          chart_output_path: "gh-dl/downloads-trend.svg"
          chart_types: "total-trend,daily,weekly,monthly"
          chart_themes: "black,slate,orange"
          charts_output_dir: "gh-dl/charts"
          chart_width: "1000"
          chart_height: "360"
          chart_zero_baseline: "true"
          chart_y_ticks: "6"
          chart_x_label_every_days: "0"
          chart_show_value_labels: "false"
          chart_date_label_format: "yyyy-mm-dd"
          chart_show_generated_at: "true"
          chart_title_mode: "default"

  automerge:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: automerge
        uses: pascalgn/automerge-action@v0.16.2
        env:
          GITHUB_TOKEN: ${{ secrets.BEARSAMPP_BOT_PAT }}
          MERGE_LABELS: "automerge"
          MERGE_METHOD: "squash"
