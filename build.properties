# GitHub API token: DO NOT put a token in this file - it is committed to the repo.
# Provide it via the GITHUB_TOKEN environment variable or an untracked
# build.local.properties file (github.token = ...) which is gitignored.

# Application configuration
appconf.lang = english
appconf.timezone = America/Chicago
appconf.notepad = notepad.exe
appconf.maxLogsArchives = 50
appconf.logsVerbose = 0
appconf.scriptsTimeout = 120
appconf.downloadId =
appconf.IncludePR = 0
appconf.EnhancedQuickPick = 1

# Release configuration
release.version = 2026.10.13
release.format = 7z
release.release.type =
# Version keywords that mark a pre-release build; these are excluded from
# updateVersions selection for all modules (bins, apps, tools).
release.excludePrereleaseKeywords = alpha,beta,rc,dev,snapshot,nightly,preview

# Development and build directories
dev.dir = ../dev
build.dir = ../bearsampp-build/exe
sandbox.dir = ../sandbox

# threads: auto (auto-detects CPU count - 1) | -1 (same as auto) | number (uses specified threads)
threads = auto

# Binaries versions
bin.apache.version = 2.4.69
bin.mailpit.version = 1.31.4
bin.mariadb.version = 13.0.2
bin.maria.version = 12.1.2
bin.memcached.version = 1.6.45
bin.mysql.version = 26.7.0
bin.nodejs.version = 26.11.1
bin.php.version = 8.5.11
bin.postgresql.version = 18.6
bin.xlight.version = 3.9.5

# Applications versions
app.phpmyadmin.version = 5.2.3
app.phppgadmin.version = 7.14.8

# Tools versions
tool.bruno.version = 4.2.0
tool.composer.version = 2.10.3
tool.ghostscript.version = 10.07.1
tool.git.version = 2.56.0.2
tool.ngrok.version = 3.39.11
tool.perl.version = 5.42.2.1
tool.powershell.version = 7.6.6
tool.python.version = 3.14.7
tool.ruby.version = 4.0.6-1