<div class = "col-3 alert alert-dismissible alert-success no-display latestversion" id = "latestversionnotify" role = "alert">
	<button data-dismiss = "alert" id = "latestversionclose" class = "close-button float-end" type = "button"><i class = "fa-regular fa-circle-xmark"></i></button>
	<h4><?php echo $bearsamppLang->getValue(Lang::CHECK_VERSION_AVAILABLE_TEXT); ?></h4>
	<div class = "latestversion-download"></div>
	<div class = "latestversion-changelog"></div>
</div>
<script nonce="<?php echo Csrf::getCspNonce(); ?>">
	// Bound with addEventListener rather than an inline onclick attribute:
	// script-src does not allow 'unsafe-inline', and a nonce cannot be attached
	// to an event handler attribute.
	document.addEventListener('DOMContentLoaded', function () {
		var closeButton = document.getElementById('latestversionclose');
		if (closeButton) {
			closeButton.addEventListener('click', function () {
				var notify = document.getElementById('latestversionnotify');
				if (notify) {
					notify.style.display = 'none';
				}
			});
		}
	});
</script>
