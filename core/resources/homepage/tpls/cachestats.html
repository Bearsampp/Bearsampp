// Cache stats page - populated from Root::getCacheStats()
$cacheStats = Root::getCacheStats();

$cacheAgeText = '';
if ($cacheStats['enabled'] && $cacheStats['oldestEntry'] !== null) {
    $ageSeconds = time() - (int) $cacheStats['oldestEntry'];
    if ($ageSeconds < 60) {
        $cacheAgeText = 'just now';
    } elseif ($ageSeconds < 3600) {
        $cacheAgeText = floor($ageSeconds / 60) . ' minute(s) ago';
    } elseif ($ageSeconds < 86400) {
        $cacheAgeText = floor($ageSeconds / 3600) . ' hour(s) ago';
    } else {
        $cacheAgeText = floor($ageSeconds / 86400) . ' day(s) ago';
    }
}

$cacheNewestText = 'never';
if ($cacheStats['enabled'] && $cacheStats['newestEntry'] !== null) {
    $ageSeconds = time() - (int) $cacheStats['newestEntry'];
    if ($ageSeconds < 60) {
        $cacheNewestText = 'just now';
    } elseif ($ageSeconds < 3600) {
        $cacheNewestText = floor($ageSeconds / 60) . ' minute(s) ago';
    } elseif ($ageSeconds < 86400) {
        $cacheNewestText = floor($ageSeconds / 3600) . ' hour(s) ago';
    } else {
        $cacheNewestText = floor($ageSeconds / 86400) . ' day(s) ago';
    }
}

<script>
function clearCache() {
    var btn = document.getElementById('clearCacheBtn');
    var alert = document.getElementById('cacheAlert');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Clearing...';
    alert.className = 'd-none';

    var xhr = new XMLHttpRequest();
    xhr.open('POST', AJAX_URL, true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        try {
            var data = JSON.parse(xhr.responseText);
            if (data.success) {
                alert.className = 'alert alert-success';
                alert.innerHTML = '<i class="fa-solid fa-check-circle"></i> Cache cleared — ' + data.deleted + ' file(s) deleted.';
                document.getElementById('statFilesCount').textContent = data.filesCount;
                document.getElementById('statTotalSize').textContent = formatBytes(data.totalSize);
                document.getElementById('statLargestEntry').textContent = formatBytes(data.largestEntry);
                document.getElementById('statLastUpdate').textContent = data.newestEntry ? formatAge(data.newestEntry) : 'never';
                document.getElementById('cacheAgeText').textContent = 'Last cleared: ' + (data.oldestEntry ? formatAge(data.oldestEntry) : 'just now');
            } else {
                alert.className = 'alert alert-danger';
                alert.innerHTML = '<i class="fa-solid fa-exclamation-triangle"></i> Error: ' + (data.error || 'Unknown error');
            }
        } catch (e) {
            alert.className = 'alert alert-danger';
            alert.innerHTML = '<i class="fa-solid fa-exclamation-triangle"></i> Unexpected server response.';
        }
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-trash-can"></i> Clear cache';
    };
    xhr.onerror = function() {
        alert.className = 'alert alert-danger';
        alert.innerHTML = '<i class="fa-solid fa-exclamation-triangle"></i> Network error.';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-trash-can"></i> Clear cache';
    };
    xhr.send('proc=clearcache&csrf_token=' + encodeURIComponent(getCsrfToken()));
}

function formatAge(ts) {
    if (!ts) return 'never';
    var s = Math.floor(Date.now() / 1000) - ts;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' minute(s) ago';
    if (s < 86400) return Math.floor(s / 3600) + ' hour(s) ago';
    return Math.floor(s / 86400) + ' day(s) ago';
}

function formatBytes(bytes) {
    bytes = parseInt(bytes, 10);
    if (bytes === 0) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = Math.floor(Math.log(bytes) / Math.log(1024));
    i = Math.min(i, units.length - 1);
    return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + units[i];
}
</script>
